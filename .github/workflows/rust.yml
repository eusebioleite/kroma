name: Rust CI/CD

on:
  push:
    branches: [ "main" ]
  # PRs apenas rodam os testes, não geram releases
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Oracle Instant Client
        shell: pwsh
        run: |
          $basicUrl = "https://download.oracle.com/otn_software/nt/instantclient/2326300/instantclient-basic-windows.x64-23.26.3.0.0.zip"
          $sdkUrl = "https://download.oracle.com/otn_software/nt/instantclient/2326300/instantclient-sdk-windows.x64-23.26.3.0.0.zip"
      
          New-Item -ItemType Directory -Path "C:\oracle" -Force | Out-Null
      
          Invoke-WebRequest -Uri $basicUrl -OutFile "C:\oracle\basic.zip"
          Invoke-WebRequest -Uri $sdkUrl -OutFile "C:\oracle\sdk.zip"
      
          Expand-Archive -Path "C:\oracle\basic.zip" -DestinationPath "C:\oracle" -Force
          Expand-Archive -Path "C:\oracle\sdk.zip" -DestinationPath "C:\oracle" -Force
      
          $clientPath = Get-ChildItem "C:\oracle" -Directory | Where-Object { $_.Name -like "instantclient_*" } | Select-Object -First 1 -ExpandProperty FullName
          $sdkLibPath = Join-Path $clientPath "sdk\lib\msvc"
      
          Write-Host "Oracle Client: $clientPath"
          Write-Host "OCI library: $sdkLibPath"
      
          if (!(Test-Path "$sdkLibPath\oci.lib")) {
            Write-Error "oci.lib não encontrado em $sdkLibPath"
            Get-ChildItem "C:\oracle" -Recurse -Filter "oci.lib" | Select-Object FullName
            exit 1
          }
      
          echo "OCI_LIB_DIR=$sdkLibPath" >> $env:GITHUB_ENV
          echo "$clientPath" >> $env:GITHUB_PATH

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --verbose

      - name: Run cargo clippy
        run: cargo clippy --verbose -- -D warnings

      - name: Run cargo test
        run: cargo test --verbose

      - name: Run cargo build (Release)
        run: cargo build --verbose --release

      # ====================================================================
      # Etapas exclusivas para criação de Release (Apenas em Push na Main)
      # ====================================================================

      - name: Bump version and push tag
        id: tag_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # Incrementa a versão automaticamente (ex: v0.0.1 -> v0.0.2)
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          files: target/release/kroma.exe
          generate_release_notes: true
