[package]
name = "kroma"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
chrono = { version = "0.4.45", features = ["serde"] }
lettre = { version = "0.11.23", features = ["smtp-transport", "tokio1-native-tls"] }
nu-ansi-term = "0.50.3"
serde = { version = "1.0.229", features = ["derive"] }
sibyl = { version = "0.7.1", features = ["nonblocking", "tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "local-time", "fmt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
